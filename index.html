<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance & Grade Tracker</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-container" class="center-container">
        <div class="card login-card">
            <h2>🔒 Teacher Portal</h2>
            <p>Sign in with your authorized Google account to access records.</p>
            <button id="google-login-btn" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                Sign in with Google
            </button>
            <p id="access-denied" class="error-msg" style="display: none;">Access Denied! Unauthorized Google account.</p>
        </div>
    </div>

    <!-- 2. PROTECTED DASHBOARD -->
    <div id="dashboard-container" style="display: none;">
        <header>
            <div>
                <h1>🎓 Student Attendance & Grade Tracker</h1>
                <p id="user-info" class="user-badge"></p>
            </div>
            <button id="logout-btn" class="btn-logout">Log Out</button>
        </header>

        <main class="container">
            <!-- Add Student Form -->
            <section class="card">
                <h2>Add New Student</h2>
                <form id="student-form">
                    <input type="text" id="student-name" placeholder="Student Full Name" required>
                    <input type="text" id="student-id" placeholder="Student ID Number" required>
                    <button type="submit">Add Student</button>
                </form>
            </section>

            <!-- Student Roster Table -->
            <section class="card">
                <h2>Student Records</h2>
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Attendance Status</th>
                            <th>Grade (%)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-list">
                        <!-- Cloud records load dynamically here -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
