<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-container" class="center-container">
        <div class="card login-card">
            <h2>🔒 Admin Login</h2>
            <p>Please enter your credentials to access the portal.</p>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
            <p id="login-error" class="error-msg" style="display: none;">Invalid username or password!</p>
        </div>
    </div>

    <!-- 2. PROTECTED DASHBOARD -->
    <div id="dashboard-container" style="display: none;">
        <header>
            <h1>🎓 Student Attendance & Grade Tracker</h1>
            <button id="logout-btn" class="btn-logout">Log Out</button>
        </header>

        <main class="container">
            <!-- Add Student Form -->
            <section class="card">
                <h2>Add New Student</h2>
                <form id="student-form">
                    <input type="text" id="student-name" placeholder="Student Full Name" required>
                    <input type="text" id="student-id" placeholder="Student ID Number" required>
                    <button type="submit">Add Student</button>
                </form>
            </section>

            <!-- Student Roster Table -->
            <section class="card">
                <h2>Student Records</h2>
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Attendance Status</th>
                            <th>Grade (%)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-list">
                        <!-- Dynamic rows added here -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
